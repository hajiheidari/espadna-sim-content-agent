[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "espadna-sim-content-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "python-telegram-bot>=22,<23", "tzdata>=2025.1"]

[project.scripts]
espadna = "espadna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
espadna = ["*.sql"]
